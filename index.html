<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Control de Asistencia y Nómina</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z'/></svg>">
</head>
<body class="login-page">

    <!-- Orbes con animación suave flotante -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            
            <!-- Cabecera y Logo -->
            <div class="login-header">
                <div class="brand-icon-wrapper">
                    <!-- Icono SVG corporativo -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                        <path d="M7 8h10M7 12h5"></path>
                    </svg>
                </div>
                <h1>Control de Asistencia y Nómina</h1>
                <p>Ingresa tus credenciales para acceder al sistema</p>
            </div>

            <!-- Caja de Alertas (Animada) -->
            <div id="alertBox" class="alert-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="alertMessage"></span>
            </div>

            <!-- Formulario de Login -->
            <form id="loginForm" autocomplete="off" novalidate>
                
                <!-- Campo Usuario o Cédula -->
                <div class="form-group">
                    <label for="usuario">Usuario o Cédula</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input 
                            type="text" 
                            id="usuario" 
                            name="usuario" 
                            class="form-control" 
                            placeholder="Ej: admin o V-10293847" 
                            required 
                            autofocus
                        >
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="••••••••" 
                            required
                        >
                        <!-- Botón para ver/ocultar contraseña -->
                        <button type="button" class="toggle-password" id="togglePassword" title="Mostrar/Ocultar contraseña" aria-label="Mostrar/Ocultar contraseña">
                            <!-- Icono Ojo Abierto -->
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <!-- Icono Ojo Tachado (Oculto inicialmente) -->
                            <svg class="icon-eye-off" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Opciones (Recordarme / Olvidé clave) -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Recordarme</span>
                    </label>
                    <a href="javascript:void(0)" onclick="alert('Comunícate con el Administrador de Sistemas para restablecer tu contraseña.')" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón de Envío con Animación / Spinner -->
                <button type="submit" id="submitBtn" class="btn-login">
                    <span class="spinner"></span>
                    <span class="btn-text">Iniciar Sesión</span>
                    <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Credenciales rápidas de prueba -->
            <div class="demo-credentials-box">
                <p>Credenciales de prueba (Haz clic para rellenar)</p>
                <div class="pill-group">
                    <button type="button" class="pill-demo" onclick="setDemoCredentials('admin', 'admin123')">
                        👑 Admin: <b>admin</b>
                    </button>
                    <button type="button" class="pill-demo" onclick="setDemoCredentials('recursoshumanos', 'admin123')">
                        📋 RRHH: <b>recursoshumanos</b>
                    </button>
                    <button type="button" class="pill-demo" onclick="setDemoCredentials('V-10293847', 'admin123')">
                        🪪 Cédula: <b>V-10293847</b>
                    </button>
                </div>
            </div>

            <!-- Footer con estado del sistema -->
            <div class="login-footer">
                <span class="status-dot"></span>
                <span>Base de Datos: <b>control_asistencia_nomina</b></span>
            </div>

        </div>
    </div>

    <!-- Script de validación y animación (Compatible con GitHub Pages y XAMPP) -->
    <script src="assets/js/main.js"></script>
</body>
</html>
